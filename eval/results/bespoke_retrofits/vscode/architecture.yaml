version: 1
project: vscode-code-layering-retrofit
roots:
  main:
    path: src/vs
    language: js
layers:
  discovery:
  - root: main
    pattern: src/vs/**/{layer}/**
  declared:
  - browser
  - common
  - electron-browser
  - electron-main
  - electron-utility
  - node
unresolved_policy:
  default: 'off'
rules:
- id: layer-browser-not-electron-browser
  kind: layer-dependency
  severity: warning
  forbid:
    from_layer: browser
    to_layer: electron-browser
  scope:
    roots:
    - main
  message: 'Bad layering. You are not allowed to access electron-browser from here,
    allowed layers are: [browser, common]'
  remedy: Move the code, or reach the other layer through a service interface declared
    in a common layer.
- id: layer-browser-not-electron-main
  kind: layer-dependency
  severity: warning
  forbid:
    from_layer: browser
    to_layer: electron-main
  scope:
