    path: clients/src/main/java
    language: java
unresolved_policy:
  default: 'off'
rules:
- id: ic-org-apache-kafka-clients
  kind: forbidden-target
  severity: error
  scope:
    roots:
    - main
    paths:
    - clients/src/main/java/org/apache/kafka/clients/*.java
  forbid:
  - org.apache.kafka.server.authorizer.AclDeleteResult
  message: Import denied by checkstyle ImportControl for package org.apache.kafka.clients.
  remedy: Add an <allow> element to checkstyle/import-control.xml or drop the dependency.
